<!DOCTYPE html>
<html lang="es" data-theme="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Empresa – Contacto</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- AOS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <!-- Icons & Styles -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="/manifest.json">

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Mi Empresa",
      "url": "https://tu-dominio.com",
      "logo": "https://tu-dominio.com/images/fire-303309_640.png",
      "sameAs": [
        "https://facebook.com/tuempresa",
        "https://twitter.com/tuempresa"
      ]
    }
    </script>
    

</head>
<body>
  <!-- Theme Toggle -->
  <button id="theme-toggle" aria-label="Cambiar tema">🌙</button>

  <!-- Navbar -->
  <nav id="navbar" class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><img src="images/fire-303309_640.png" alt="Logo Mi Empresa" height="30"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">Nosotros</a></li>
          <li class="nav-item"><a class="nav-link" href="services.html">Servicios</a></li>
          <li class="nav-item"><a class="nav-link" href="portfolio.html">Portafolio</a></li>
          <li class="nav-item"><a class="nav-link" href="testimonials.html">Testimonios</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenido Contacto -->
  <section id="contact" class="py-5" data-aos="fade-up">
    <div class="container">
      <h1 class="text-center">Contáctanos</h1>
      <form class="row g-3 mt-4 mx-auto" style="max-width:600px;">
        <div class="col-md-6">
          <label for="nombre" class="visually-hidden">Nombre</label>
          <input type="text" class="form-control" id="nombre" placeholder="Nombre" required>
        </div>
        <div class="col-md-6">
          <label for="email" class="visually-hidden">Correo Electrónico</label>
          <input type="email" class="form-control" id="email" placeholder="Correo Electrónico" required>
        </div>
        <div class="col-12">
          <label for="mensaje" class="visually-hidden">Mensaje</label>
          <textarea class="form-control" id="mensaje" rows="4" placeholder="Mensaje" required></textarea>
        </div>
        <div class="col-12 text-center">
          <button type="submit" class="btn btn-primary">Enviar</button>
        </div>
      </form>
    </div>
  </section>

  <main>
    <iframe
    src="https://www.google.com/maps/embed?pb=TU_CODIGO"
    width="100%" height="350" style="border:0;" allowfullscreen loading="lazy">
  </iframe>

  </main>

  <!-- Back to Top -->
  <button id="backToTop" aria-label="Volver arriba"><i class="bi bi-arrow-up"></i></button>

  <!-- Footer -->
  <footer>
    <div class="container text-center">
      <p>&copy; <span id="year"></span> Mi Empresa. Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ once: true, duration: 800, offset: 200, easing: 'ease-in-out-cubic' });
    document.getElementById('year').textContent = new Date().getFullYear();
    const themeToggle = document.getElementById('theme-toggle');
    themeToggle.addEventListener('click', () => {
      const dt = document.documentElement;
      dt.dataset.theme = dt.dataset.theme === 'dark' ? '' : 'dark';
    });
    const back = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      back.classList.toggle('show', window.scrollY > window.innerHeight);
    });
    back.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  </script>
</body>
</html>
